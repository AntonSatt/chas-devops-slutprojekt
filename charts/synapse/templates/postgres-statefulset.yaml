# Postgres är databasen där Synapse sparar användare, rum och meddelanden.
# StatefulSet i stället för Deployment: podden får ett fast namn
# (synapse-postgres-0) och en egen volym som följer med om podden startas om.
# En Deployment skulle kunna starta en ny pod innan den gamla är borta, och
# två Postgres på samma datakatalog förstör databasen.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "synapse.postgresHost" . }}
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # Den headless servicen i postgres-service.yaml. Den ger podden ett eget
  # DNS-namn.
  serviceName: {{ include "synapse.postgresHost" . }}
  # En enda Postgres. Fler repliker kräver replikering, som Postgres inte
  # sköter av sig själv.
  replicas: 1
  selector:
    matchLabels:
      {{- include "synapse.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synapse.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Imagen skapar användaren och databasen första gången den
            # startar, när datakatalogen är tom.
            - name: POSTGRES_USER
              value: synapse
            - name: POSTGRES_DB
              value: synapse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-password
            # Synapse vägrar starta om databasen inte sorterar text med
            # locale C. Det går bara att välja när databasen skapas.
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
            # En underkatalog, för roten på en ny volym kan innehålla
            # lost+found och då vägrar Postgres initiera där.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # pg_isready frågar Postgres om den tar emot anslutningar. Först då
          # räknas podden som redo och får trafik via servicen.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "synapse", "-d", "synapse"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "synapse", "-d", "synapse"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # En PVC per pod, skapad av StatefulSeten: data-synapse-postgres-0. Den
  # finns kvar även om StatefulSeten tas bort, så datan inte försvinner av
  # misstag.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # ReadWriteOnce: bara en nod i taget kan montera volymen, vilket
        # räcker för en enda Postgres.
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
