apiVersion: v1
kind: Service
metadata:
  name: {{ include "minio.fullname" . }}-console
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  type: {{ .Values.serviceConsole.type }}
  ports:
    - port: {{ .Values.serviceConsole.port }}
      targetPort: http-console
      protocol: TCP
      name: http
  selector:
    {{- include "minio.selectorLabels" . | nindent 4 }}
