{{- if and .Values.metrics.enabled .Values.grafanaDashboard.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "minio.fullname" . }}-grafana-dashboard
  labels:
    {{- include "minio.labels" . | nindent 4 }}
    grafana_dashboard: "1" 
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  minio-overview.json: |
    {{- .Files.Get "dashboards/minio-overview.json" | nindent 4 }}
{{- end -}}
