{{- if .Values.metrics.enabled }}
# Larmregler. Prometheus läser PrometheusRules i alla namespaces och skickar
# larm som brinner via Alertmanager till Mattermost. Siffrorna kommer från
# kube-state-metrics, så larmen fungerar även när podden är helt borta och
# appens egna /metrics inte går att skrapa.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "gitea.fullname" . }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
spec:
  groups:
    - name: gitea
      rules:
        # Ingen Gitea-pod är Ready, alltså når ingen användare Gitea.
        # Readiness kollar databasen, så larmet går även när Postgres är nere.
        - alert: GiteaNere
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}", deployment="{{ include "gitea.fullname" . }}"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Gitea i {{ .Release.Namespace }} har ingen pod som tar trafik"
        # Postgres-podden är inte Ready. Talar om var felet sitter när
        # GiteaNere går samtidigt.
        - alert: GiteaPostgresNere
          expr: kube_statefulset_status_replicas_ready{namespace="{{ .Release.Namespace }}", statefulset="{{ include "gitea.fullname" . }}-postgres"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Giteas Postgres i {{ .Release.Namespace }} är nere"
{{- end }}
