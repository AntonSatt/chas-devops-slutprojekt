# Giteas /data: repon, app.ini och bilagor. Egen fil eftersom en Deployment
# inte har volumeClaimTemplates. RWO räcker, Gitea kör alltid en pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gitea.fullname" . }}-data
  # Repona ska överleva att chartet tas bort. Helm hoppar över PVC:n vid
  # helm uninstall, och Argo lämnar den kvar när appen raderas. Postgres PVC
  # från volumeClaimTemplates blir kvar av sig själv.
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
