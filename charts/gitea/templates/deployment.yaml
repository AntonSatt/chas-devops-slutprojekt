apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitea.fullname" . }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
spec:
  # En pod: /data är en RWO-volym på en nod, och Gitea klarar inte flera
  # poddar mot samma katalog. Recreate tar bort den gamla podden innan den
  # nya startar, så de aldrig använder volymen samtidigt.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gitea.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gitea
  template:
    metadata:
      labels:
        {{- include "gitea.labels" . | nindent 8 }}
        app.kubernetes.io/component: gitea
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          # GITEA__sektion__NYCKEL skrivs in i app.ini när containern startar.
          env:
            - name: GITEA__database__DB_TYPE
              value: postgres
            # headless-Servicen, DNS svarar med Postgres-poddens IP
            - name: GITEA__database__HOST
              value: {{ include "gitea.fullname" . }}-postgres:5432
            - name: GITEA__database__NAME
              value: gitea
            - name: GITEA__database__USER
              value: gitea
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: postgres-password
            # Måste vara adressen användarna når Gitea på, annars blir
            # clone-URL:er och redirects fel.
            - name: GITEA__server__ROOT_URL
              value: https://{{ .Values.ingress.host }}/
            - name: GITEA__server__DOMAIN
              value: {{ .Values.ingress.host }}
            # hoppar över installationsguiden, inställningarna kommer härifrån
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            # Bara administratören skapar konton (se NOTES.txt). Annars kan
            # vem som helst på internet registrera sig.
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            # Ingen Service för port 22, så SSH-kloning går ändå inte. Döljer
            # SSH-URL:en i webbgränssnittet. Imagens egen sshd lyssnar fortfarande
            # på 22 i podden, men inget utanför podden når den.
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            # /metrics på samma port som webben, 3000
            - name: GITEA__metrics__ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            # /metrics nås via Ingressen, så den kräver en Bearer-token.
            # Prometheus skickar samma token, se servicemonitor.yaml.
            - name: GITEA__metrics__TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrics.existingSecret }}
                  key: token
            {{- end }}
          ports:
            - name: http
              # Giteas standardport, inget som behöver kunna ändras
              containerPort: 3000
              protocol: TCP
          # Första starten skapar alla tabeller i en tom databas och tar tid.
          # Liveness och readiness väntar tills den här lyckats, upp till 5 min.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          # Liveness kollar bara att porten svarar. /api/healthz kollar även
          # databasen, och en nere Postgres ska inte starta om Gitea.
          livenessProbe:
            tcpSocket:
              port: http
          # Readiness får kolla databasen: utan den ska podden inte ta trafik.
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "gitea.fullname" . }}-data
