apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitea.fullname" . }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  # ClusterIP: bara nåbar inne i klustret, Traefik står för vägen in
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gitea.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
