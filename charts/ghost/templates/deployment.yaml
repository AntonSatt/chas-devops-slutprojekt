apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ghost-chart.fullname" . }}
  labels:
    {{- include "ghost-chart.labels" . | nindent 4 }}


spec:
  replicas: {{ .Values.replicaCount }}
  # den gamla podden stoppas innan den nya startar, eftersom
  # ReadWritOnce-disken inte kan kopplas till två poddar samtidigt
  strategy:
    type: Recreate


  selector:
    matchLabels:
      {{- include "ghost-chart.selectorLabels" . | nindent 6 }}
      # skiljer Ghost-poddarna från MYSQL-poddarna så att de inte blandas ihop i samma release
      app.kubernetes.io/component: ghost


  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ghost-chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: ghost
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # standardkontot, som finns i varje namespace. Båda fälten sätts uttryckligen,
      # annars fyller Kubernetes i ett gammalt kontonamn från det föråldrade fältet serviceAccount
      serviceAccountName: default
      serviceAccount: default
      # Ghost pratar inte med Kubernetes API, så ingen token monteras i podden
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "ghost-chart.fullname" . }}-mysql 3306; do echo "väntar på mysql"; sleep 2; done
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}


          env:
            - name: url
              value: {{ .Values.ghost.url | quote }}
            - name: database__client
              value: mysql
            - name: database__connection__host
              value: {{ include "ghost-chart.fullname" . }}-mysql
            - name: database__connection__user
              value: {{ .Values.mysql.user | quote }}
            - name: database__connection__database
              value: {{ .Values.mysql.database | quote }}
            - name: database__connection__password
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret }}
                  key: mysql-password
            # ingen e-post är konfigurerad, så Ghost får inte kräva en kod via mejl
            # när en admin loggar in från en ny enhet
            - name: security__staffDeviceVerification
              value: "false"

          volumeMounts:
            - name: content
              mountPath: /var/lib/ghost/content


          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: {{ include "ghost-chart.fullname" . }}-content
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
