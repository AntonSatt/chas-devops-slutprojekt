alloy:
  # montera nodens /var/log i Alloy, där journald sparar loggarna
  mounts:
    varlog: true
    # montera nodens machine-id så journal-läsaren hittar rätt undermapp
    extra:
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
  configMap:
    # Alloys konfiguration. Källa: Alloys dokumentation,
    # "Collect Kubernetes logs and forward them to Loki".
    #
    # loki.write: från avsnittet "Configure logs delivery".
    #   URL:en kommer från Lokis NOTES efter installationen.
    # discovery.kubernetes, discovery.relabel, loki.source.kubernetes:
    #   från avsnittet "Pod logs", oförändrade.
    # ÄNDRAT: loki.source.kubernetes skickar direkt till loki.write.
    #   loki.process med etiketten cluster är borttagen tills vidare,
    #   den kräver ett klusternamn som skiljer dev och prod.
    content: |
      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      discovery.kubernetes "pod" {
        role = "pod"
        selectors {
          role = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action = "replace"
          target_label = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action = "replace"
          target_label = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action = "replace"
          target_label = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action = "replace"
          target_label = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          target_label = "job"
          separator = "/"
          replacement = "$1"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          target_label = "__path__"
          separator = "/"
          replacement = "/var/log/pods/*$1/*.log"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_id"]
          action = "replace"
          target_label = "container_runtime"
          regex = `^(\S+):\/\/.+$`
          replacement = "$1"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      loki.relabel "journal" {
        forward_to = []
        
        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label = "unit"
        }
        rule {
          source_labels = ["__journal__hostname"]
          target_label = "node"
          }
        }

        loki.source.journal "read" {
          forward_to    = [loki.write.default.receiver]
          relabel_rules = loki.relabel.journal.rules
          labels        = {job = "journal"}
        }
controller:
  volumes:
    # volymen som pekar på nodens /etc/machine-id
    extra:
      - name: machine-id
        hostPath:
          path: /etc/machine-id
          type: File