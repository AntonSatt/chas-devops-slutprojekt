# Values till kube-prometheus-stack: Prometheus, Grafana, Alertmanager,
# node-exporter och kube-state-metrics i ett paket, redan ihopkopplade.
# Versionen pinnas i kubernetes/apps/templates/monitoring.yaml.

# k3s kör controller-manager, scheduler, proxy och etcd inne i k3s-processen,
# inte som egna poddar. Stackens mål för dem hittar ingenting och ger bara
# falska larm, så de stängs av.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    # false = ta ServiceMonitors, PodMonitors och larmregler från hela
    # klustret, inte bara från den här Helm-releasen. Det är det som gör att
    # allas egna charts syns i Prometheus utan att någon rör monitoring.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

# node-exporter ger metrics för själva noderna (CPU, minne, disk). Den körs
# på varje nod och måste tåla control planes taint, annars får vi bara
# workern.
prometheus-node-exporter:
  tolerations:
    - operator: Exists

# Alertmanager tar emot larm från Prometheus och skickar dem vidare. Se
# docs/monitoring/larm.md.
alertmanager:
  alertmanagerSpec:
    # Secreten skapas av Ansible (rollen app_secrets) och monteras som fil i
    # /etc/alertmanager/secrets/alertmanager-mattermost/.
    secrets:
      - alertmanager-mattermost
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: mattermost
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog brinner alltid, som bevis på att kedjan lever, och
        # InfoInhibitor är intern. Ingen av dem ska till kanalen.
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        # Bara warning och critical går till Mattermost.
        - receiver: "null"
          matchers:
            - severity = "info"
    receivers:
      - name: "null"
      - name: mattermost
        # Mattermost tar emot samma format som Slacks webhooks.
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-mattermost/url
            # Skicka ett OK när larmet clearas. Uppgiften kräver det.
            send_resolved: true
            username: alertmanager
            title: '{{ if eq .Status "firing" }}LARM{{ else }}OK{{ end }} [{{ .CommonLabels.cluster }}]: {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}{{ .Annotations.summary }}{{ if .Annotations.description }}
              {{ .Annotations.description }}{{ end }}
              {{ end }}

grafana:
  admin:
    # Skapas av Ansible från GRAFANA_ADMIN_PASSWORD. Chartens eget slumpade
    # lösenord fungerar inte med Argo CD: det slumpas om vid varje synk.
    existingSecret: grafana-admin
  persistence:
    enabled: true
    size: 2Gi
  sidecar:
    dashboards:
      # Dashboards laddas från ConfigMaps med labeln grafana_dashboard: "1",
      # i alla namespaces. Så kan varje app ta med sin egen dashboard.
      searchNamespace: ALL
