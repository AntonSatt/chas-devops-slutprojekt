# Alloy: samlar loggar från poddar och journald på varje nod, se docs/loggar/loggar.md.
# Två källor: charten från grafana, values från repot (ref: values).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        valueFiles:
          - $values/kubernetes/values/alloy.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true