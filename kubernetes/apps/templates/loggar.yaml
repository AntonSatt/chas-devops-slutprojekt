# Manifest för loggdelen som inte kommer från en chart,
# i dag Loki-datasourcen för Grafana. Se docs/loggar/loggar.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loggar
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: kubernetes/manifests/loggar
  destination:
    server: https://kubernetes.default.svc
    # Grafana letar bara efter datasources i sitt eget namespace
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true