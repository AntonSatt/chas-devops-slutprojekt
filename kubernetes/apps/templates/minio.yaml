apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: charts/minio
    helm:
      valueFiles:
        - ../../kubernetes/values/minio.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: minio 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
