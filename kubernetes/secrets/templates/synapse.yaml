# Synapse lösenord till Postgres och hemligheten för att skapa användare.
# Används via existingSecret i charts/synapse/values.yaml.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: synapse-secrets
  namespace: synapse
spec:
  encryptedData:
    postgres-password: 
    registration-shared-secret: 
  template:
    metadata:
      name: synapse-secrets
      namespace: synapse
