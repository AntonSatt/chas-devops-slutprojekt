# MySQL-lösenorden för Ghost. Används via mysql.existingSecret i
# charts/ghost/values.yaml. Nycklarna matchar dem StatefulSeten och Ghost läser.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghost-mysql
  namespace: ghost
spec:
  encryptedData:
    mysql-exporter-password: 
    mysql-password: 
    mysql-root-password: 
  template:
    metadata:
      name: ghost-mysql
      namespace: ghost
    type: Opaque
