
stages:
  - prepare
  - validate
  - deploy
  - maintenance
  - cleanup


variables:
  STATE_URL: https://git.chas-lab.dev/api/v4/projects/582/terraform/state
  IMAGE_UTIL: "${CI_REGISTRY_IMAGE}/util"

workflow:
  rules:

    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        VERSION: group1
        DEPLOY: false

    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH  &&  $CI_PIPELINE_SOURCE != "merge_request_event"  &&  $CI_PIPELINE_SOURCE != "schedule"
      variables:
        VERSION: group1
        DEPLOY: true

    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        VERSION: mr$CI_MERGE_REQUEST_IID
        DEPLOY: true

    - when: always
      variables:
        DEPLOY: false


.buildkit:
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json


.terraform:
  image: $IMAGE_UTIL
  variables:
    # Port 6443 är öppen för alla, gruppen når API:et från laptops med olika IP
    # (port-forward, kubectl). API:et kräver certifikat. CI behöver inte porten,
    # Ansible kör helm och kubectl på noden.
    TF_VAR_admin_cidr: "0.0.0.0/0"
    TF_VAR_cluster_name: "$VERSION"
    STATE_VERSION: "$VERSION"
  before_script:
    - |
      if [ -z "$DIR" ]; then
        echo "DIR not set"
        exit 1
      fi

    - cd ${DIR}
    - pwd
    - export FULL_STATE_URL="${STATE_URL}/${STATE_VERSION}"
    - |
      echo FULL_STATE_URL: ${FULL_STATE_URL}$
    - terraform init -reconfigure
        -backend-config="address=${FULL_STATE_URL}"
        -backend-config="lock_address=${FULL_STATE_URL}/lock"
        -backend-config="unlock_address=${FULL_STATE_URL}/lock"
        -backend-config="username=gitlab-ci-token"
        -backend-config="password=${CI_JOB_TOKEN}"
        -backend-config="lock_method=POST"
        -backend-config="unlock_method=DELETE"
        -backend-config="retry_wait_min=5"

.ansible:
  image: $IMAGE_UTIL
  before_script:
    - cd ansible
    - export ANSIBLE_CONFIG=$PWD/ansible.cfg # explicitly setting config, as otherwise it wont allow as the file is "world writable"
    - echo $ANSIBLE_VAULT_PASSWORD > .vault_pass
    - mkdir -p $HOME/.ssh
    - cp "$GROUP1_SSH_KEY" $HOME/.ssh/group1_hetzner
    - chmod 0600 $HOME/.ssh/group1_hetzner


build-util-image:
  extends: .buildkit
  stage: prepare
  script:
    - buildctl-daemonless.sh build
        --frontend dockerfile.v0
        --local context=.
        --local dockerfile=./ci
        --opt filename=util.Dockerfile
        --output type=image,push=true,name=$IMAGE_UTIL
  rules:
    - if: $VERSION == "group1"
      changes:
      - ci/util.Dockerfile
      - .gitlab-ci.yml


terraform-validate:
  extends: .terraform
  stage: validate
  variables:
    DIR: terraform
  rules:
    - if: $DEPLOY == "true"
  script:
    - terraform validate

terraform-deploy:
  extends: .terraform
  stage: deploy
  environment:
    name: review/$VERSION
    on_stop: terraform-destroy
  needs:
    - terraform-validate
    - helm-lint
  variables:
    DIR: terraform
  rules:
    - if: $DEPLOY == "true"
  script:
    - terraform apply -auto-approve


.terraform-dns:
  extends: .terraform
  variables:
    DIR: dns
    TF_VAR_cluster_name: dns
    STATE_VERSION: dns
  rules:
    - if: $VERSION == "group1"
      changes:
        - dns/**/*
        - .gitlab-ci.yml

terraform-validate-dns:
  extends: .terraform-dns
  stage: validate
  script:
    - terraform validate

terraform-deploy-dns:
  extends: .terraform-dns
  stage: deploy
  environment:
    name: review/$VERSION
    on_stop: terraform-destroy
  needs:
    - terraform-validate-dns
  script:
    - terraform apply -auto-approve

helm-lint:
  image: $IMAGE_UTIL
  stage: validate
  script:
    - helm lint charts/*
    - helm lint kubernetes/apps/ kubernetes/secrets
    - helm template kubernetes/apps
  rules:
    - if: $DEPLOY == "true"


terraform-destroy:
  stage: cleanup
  extends: .terraform
  variables:
    DIR: terraform
  environment:
    name: review/$VERSION
    action: stop
  needs:
    - terraform-deploy
  rules:
    - if: $DEPLOY == "true" && $VERSION && $VERSION != "group1"
      when: manual
  script:
    - terraform destroy -auto-approve
    - |
      curl "${STATE_URL}/${VERSION}" --request DELETE --header "Authorization: Bearer $CI_JOB_TOKEN"
  


ansible-deploy:
  extends: .ansible
  stage: deploy
  needs:
    - terraform-deploy
  rules:
    - if: $DEPLOY == "true"
  script:
    - echo "deploying to cluster=$VERSION"
    - ansible-galaxy collection install -r requirements.yml -p collections --force --no-cache
    - |
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        TAINT="true"
      else
        TAINT="false"
      fi

      echo "TAINT=$TAINT"

      ansible-playbook site.yml -e cluster=$VERSION -e k3s_taint_control_planes=$TAINT



put-sealed-secrets:
  stage: maintenance
  extends: .ansible
  variables:
    ALSO_PULL: true
    ALSO_COMMIT: true
    ALSO_PUSH: true
    ALSO_TEMP: true
  rules:
    - if: $VERSION  &&  $CI_PIPELINE_SOURCE == "schedule"
  script:

    - git config --global user.name "Gitlab CI Bot"
    - git config --global user.email "gitlab-ci@example.com"
    - git config --global push.autoSetupRemote true # push to remote without needing --set-upstream arg
    - git remote set-url origin https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - git switch $CI_COMMIT_BRANCH
    - git branch --set-upstream-to=origin/main main

    - echo "updating sealed secrets for cluster '$VERSION'"
    - ansible-playbook kubeconfig.yml -e cluster=$VERSION -e k3s_taint_control_planes=$TAINT
    - cd ..
    - export KUBECONFIG=$PWD/$VERSION.kubeconfig
    - ./scripts/sealed-secret-keys.sh get

