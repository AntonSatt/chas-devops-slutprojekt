# Ansible gör Kubernetes-Secrets av CI-variablerna, och apparna pekar ut dem
# med namn. Värdena skickas på stdin, så de hamnar aldrig i git eller i en
# fil på noden.

- name: Ser om alla hemligheter finns
  ansible.builtin.assert:
    that:
      - app_secrets_grafana_admin_password | length > 0
      - app_secrets_mattermost_webhook_url | length > 0
      - app_secrets_synapse_postgres_password | length > 0
      - app_secrets_synapse_registration_shared_secret | length > 0
      - app_secrets_tsig_secret | length > 0
      - app_secrets_ghost_mysql_root_password | length > 0
      - app_secrets_ghost_mysql_password | length > 0
      - app_secrets_ghost_mysql_exporter_password | length > 0
      - app_secrets_gitea_postgres_password | length > 0
      - app_secrets_gitea_metrics_token | length > 0
    fail_msg: >-
      GRAFANA_ADMIN_PASSWORD, MATTERMOST_WEBHOOK_URL, SYNAPSE_POSTGRES_PASSWORD,
      SYNAPSE_REGISTRATION_SHARED_SECRET, TF_VAR_tsig_secret, GHOST_MYSQL_ROOT_PASSWORD,
      GHOST_MYSQL_PASSWORD, GHOST_MYSQL_EXPORTER_PASSWORD, GITEA_POSTGRES_PASSWORD eller
      GITEA_METRICS_TOKEN saknas i miljön.
      I prod kommer de från CI-variablerna med samma namn, i dev från din .envrc i
      repots rot, se docs/steg-for-steg.md.
    quiet: true

- name: Skapar apparnas secrets
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  register: app_secrets_apply
  changed_when: "'configured' in app_secrets_apply.stdout or 'created' in app_secrets_apply.stdout"
  no_log: true
