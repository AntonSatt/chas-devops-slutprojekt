concurrent = 10
check_interval = 0
shutdown_timeout = 0

[session_server]
  session_timeout = 1800

[[runners]]
  name = "docker-runner"
  url = "{{ gitlab_url }}"
  id = 1
  token = "{{ gitlab_runner_token }}"
  executor = "docker"
  request_concurrency = 3
  [runners.cache]
    MaxUploadedArchiveSize = 0
    [runners.cache.s3]
    [runners.cache.gcs]
    [runners.cache.azure]
  [runners.docker]
    tls_verify = false
    image = "alpine:latest"
    privileged = false
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = ["/cache"]
    shm_size = 0
    network_mtu = 0
    memory = "1024m"
    memory_swap = "2048m"
    cpus = "1"
    security_opt = ["seccomp:unconfined", "apparmor:unconfined"]
    cap_add = ["SYS_ADMIN"]
