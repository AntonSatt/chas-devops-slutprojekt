# Körs på klustrets första control plane. k3s kubeconfig finns redan där,
# så varken Helm eller kubectl behöver nå klustret utifrån. Port 6443 är
# bara öppen för admin_cidr, så från CI hade det inte gått.

- name: Ser om repo-token finns
  ansible.builtin.assert:
    that:
      - argocd_repo_user | length > 0
      - argocd_repo_token | length > 0
    fail_msg: >-
      ARGOCD_REPO_USER eller ARGOCD_REPO_TOKEN saknas i miljön. Argo CD
      behöver dem för att läsa repot, se docs/gitops/argo-cd.md.
    quiet: true

- name: Kollar om Helm finns
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: argocd_helm_binary

- name: Installerar Helm
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ argocd_helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, linux-amd64/helm]
  when: not argocd_helm_binary.stat.exists

- name: Kopierar values till noden
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../kubernetes/values/argocd.yaml"
    dest: /root/argocd-values.yaml
    mode: "0644"
  register: argocd_values

- name: Kollar vilken Argo CD som är installerad
  ansible.builtin.command:
    cmd: helm list --namespace argocd --filter '^argocd$' --deployed --output json
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_release
  changed_when: false

# Bara när versionen eller values har ändrats, annars blir varje körning en
# ny Helm-revision i onödan. --deployed ovan gör att en misslyckad
# installation körs om nästa gång.
- name: Installerar eller uppgraderar Argo CD
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install argocd argo-cd
      --repo https://argoproj.github.io/argo-helm
      --version {{ argocd_chart_version }}
      --namespace argocd --create-namespace
      --values /root/argocd-values.yaml
      --wait --timeout 10m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: argocd_values.changed or ('argo-cd-' ~ argocd_chart_version) not in argocd_release.stdout
  changed_when: true

# Värdena skickas på stdin, så ingen fil med token blir kvar på noden.
- name: Ger Argo CD inloggning till repot
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ lookup('ansible.builtin.template', 'repo-secret.yaml.j2') }}"
  register: argocd_repo_secret
  changed_when: "'unchanged' not in argocd_repo_secret.stdout"
  no_log: true
