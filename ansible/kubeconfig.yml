- name: Fetcha kubeconfig
  hosts: "cluster_{{ cluster }}:&cp_first"
  gather_facts: false
  tasks:
    - name: Läser kubeconfig från noden
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_server_kubeconfig

    - name: Skriver kubeconfig lokalt med nodens publika adress
      ansible.builtin.copy:
        content: "{{ k3s_server_kubeconfig.content | b64decode | replace('127.0.0.1', ansible_host) }}"
        dest: "{{ playbook_dir }}/../{{ cluster }}.kubeconfig"
        mode: '0600'
      delegate_to: localhost
